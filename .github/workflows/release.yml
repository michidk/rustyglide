name: Release

on:
  push:
    tags: ["v*"]
  # Rebuild an existing tag, for example after a failed job.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Push a stable vX.Y.Z tag.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false
      - name: Install software Vulkan
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
          save-if: false
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: cargo-deny
      - name: Workspace version matches the tag
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "rustyglide") | .version')"
          [[ "v$version" == "$TAG_NAME" ]] || { echo "::error::Cargo version $version does not match $TAG_NAME"; exit 1; }
      - name: Gates
        env:
          RUSTYGLIDE_REQUIRE_GPU: '1'
          WGPU_BACKEND: vulkan
        run: bash dev/scripts/gates.sh lints && cargo test --workspace --locked

  build:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            file: libglide2x.so
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            file: glide2x.dll
          - os: windows-2025
            target: i686-pc-windows-msvc
            file: glide2x.dll
          # Cross-compiled on Intel: the Apple Silicon runner pool often has no
          # capacity, and a job it never picks up blocks the release.
          - os: macos-15-intel
            target: aarch64-apple-darwin
            file: libglide2x.dylib
          - os: macos-15-intel
            target: x86_64-apple-darwin
            file: libglide2x.dylib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Build glide2x and glide3x
        run: cargo build --locked --release -p glide2x -p glide3x --target ${{ matrix.target }}
      - name: Package
        run: |
          for lib in glide2x glide3x; do
            file="${{ matrix.file }}"
            file="${file/glide2x/$lib}"
            name="$lib-${TAG_NAME}-${{ matrix.target }}"
            mkdir -p "dist/$name"
            cp "target/${{ matrix.target }}/release/$file" README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md "dist/$name/"
            if [[ "${{ runner.os }}" == Windows ]]; then
              (cd dist && 7z a -tzip -bso0 "$name.zip" "$name" && rm -r "$name")
            else
              (cd dist && tar -czf "$name.tar.gz" "$name" && rm -r "$name")
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish GitHub release
    needs: [verify, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          fetch-depth: 0
          persist-credentials: false
      - name: Generate release changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --current --strip header --output CHANGELOG.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" artifacts/* --clobber
            gh release edit "$TAG_NAME" --notes-file CHANGELOG.md
          else
            gh release create "$TAG_NAME" artifacts/* --verify-tag --title "${TAG_NAME#v}" --notes-file CHANGELOG.md
          fi

  # Trusted publishing: crates.io trusts this workflow (configure it per crate
  # under the crate's settings, workflow `release.yml`, environment `crates-io`).
  crates:
    name: Publish to crates.io
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG_NAME }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
      - name: Get a crates.io token for this run
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${TAG_NAME#v}"
          for crate in rustyglide-core rustyglide-wgpu rustyglide; do
            # Reruns skip versions that are already on crates.io.
            if curl -sfA 'rustyglide release (github.com/michidk/rustyglide)' "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
              echo "$crate $version is already published"
              continue
            fi
            cargo publish --locked -p "$crate"
          done
