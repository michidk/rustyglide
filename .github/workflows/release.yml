name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ github.ref_name }}
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Push a stable vX.Y.Z tag.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install software Vulkan
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
          save-if: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny
      - name: Workspace version matches the tag
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "rustyglide") | .version')"
          [[ "v$version" == "$TAG_NAME" ]] || { echo "::error::Cargo version $version does not match $TAG_NAME"; exit 1; }
      - name: Gates
        env:
          RUSTYGLIDE_REQUIRE_GPU: '1'
          WGPU_BACKEND: vulkan
        run: bash dev/scripts/gates.sh lints && cargo test --workspace --locked

  build:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            file: libglide2x.so
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            file: glide2x.dll
          - os: windows-2025
            target: i686-pc-windows-msvc
            file: glide2x.dll
          - os: macos-15
            target: aarch64-apple-darwin
            file: libglide2x.dylib
          - os: macos-15-intel
            target: x86_64-apple-darwin
            file: libglide2x.dylib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.90.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Build glide2x
        run: cargo build --locked --release -p glide2x --target ${{ matrix.target }}
      - name: Package
        run: |
          name="glide2x-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.file }}" README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY.md "dist/$name/"
          (cd dist && tar -czf "$name.tar.gz" "$name" && rm -r "$name")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    name: Publish GitHub release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate release changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --current --strip header --output CHANGELOG.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG_NAME" artifacts/* --verify-tag --title "${TAG_NAME#v}" --notes-file CHANGELOG.md

  # Trusted publishing: crates.io trusts this workflow (configure it per crate
  # under the crate's settings, workflow `release.yml`, environment `crates-io`).
  crates:
    name: Publish to crates.io
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.90.0'
      - name: Get a crates.io token for this run
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in rustyglide-core rustyglide-wgpu rustyglide; do
            cargo publish --locked -p "$crate"
          done
