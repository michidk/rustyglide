name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  lints:
    name: Lints
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lints
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-deny
      - name: Format, clippy, core boundary and licences
        run: bash dev/scripts/gates.sh lints

  test:
    name: Test (Linux, lavapipe)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install software Vulkan
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
      - name: Unit, scene, combine and ABI tests
        env:
          RUSTYGLIDE_REQUIRE_GPU: '1'
          WGPU_BACKEND: vulkan
        run: cargo test --workspace --locked
      - name: Upload scene differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scene-differences
          path: crates/rustyglide-scenes/golden/*.actual.png
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          # Most Glide games are 32-bit and load a 32-bit glide2x.dll.
          - os: windows-2025
            target: i686-pc-windows-msvc
          # Cross-compiled on Intel: the Apple Silicon runner pool often has no
          # capacity, and a job it never picks up blocks the release.
          - os: macos-15-intel
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      # RUSTFLAGS replaces .cargo/config.toml's flags, so repeat the static C
      # runtime the Windows libraries ship with.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows-msvc') && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
          targets: ${{ matrix.target }}
          components: llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: build-${{ matrix.target }}
      - name: Build
        run: cargo build --locked --workspace --target ${{ matrix.target }}
      # Tests that need a GPU skip when the runner exposes no adapter.
      - name: Test
        # Cross-compiled targets cannot run on their build runner.
        if: matrix.target != 'i686-pc-windows-msvc' && matrix.target != 'aarch64-apple-darwin'
        run: cargo test --locked --workspace --exclude rustyglide-scenes --target ${{ matrix.target }}
      - name: Check decorated exports
        if: matrix.target == 'i686-pc-windows-msvc'
        run: |
          objdump="$(rustc --print sysroot)/lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-objdump.exe"
          missing=0
          for lib in glide2x glide3x; do
            exports="$("$objdump" -p "target/${{ matrix.target }}/debug/$lib.dll" | tr -d '\r')"
            grep -m 3 '_gr' <<<"$exports" || true
            while read -r name bytes; do
              [[ -z "$name" || "$name" == \#* ]] && continue
              grep -qE "(^|[[:space:]])_${name}@${bytes}([[:space:]]|\$)" <<<"$exports" || { echo "missing $lib export _${name}@${bytes}"; missing=1; }
            done < <(tr -d '\r' < "crates/$lib/exports.txt")
            # The DLLs must load on a plain Windows: no Visual C++ runtime imports.
            if grep -iE 'DLL Name: (vcruntime|msvcp|api-ms-win-crt)' <<<"$exports"; then
              echo "$lib.dll imports the Visual C++ runtime"; missing=1
            fi
          done
          exit $missing
