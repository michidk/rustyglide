name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  lints:
    name: Lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lints
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny
      - name: Format, clippy, core boundary and licences
        run: bash dev/scripts/gates.sh lints

  test:
    name: Test (Linux, lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install software Vulkan
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.90.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
      - name: Unit, scene, combine and ABI tests
        env:
          RUSTYGLIDE_REQUIRE_GPU: '1'
          WGPU_BACKEND: vulkan
        run: cargo test --workspace --locked
      - name: Upload scene differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scene-differences
          path: crates/rustyglide-scenes/golden/*.actual.png
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          # Most Glide games are 32-bit and load a 32-bit glide2x.dll.
          - os: windows-2025
            target: i686-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.90.0'
          targets: ${{ matrix.target }}
          components: llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: build-${{ matrix.target }}
      - name: Build
        run: cargo build --locked --workspace --target ${{ matrix.target }}
      # Tests that need a GPU skip when the runner exposes no adapter.
      - name: Test
        if: matrix.target != 'i686-pc-windows-msvc'
        run: cargo test --locked --workspace --exclude rustyglide-scenes --target ${{ matrix.target }}
      - name: Check decorated exports
        if: matrix.target == 'i686-pc-windows-msvc'
        run: |
          objdump="$(rustc --print sysroot)/lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-objdump.exe"
          exports="$("$objdump" -p "target/${{ matrix.target }}/debug/glide2x.dll" | tr -d '\r')"
          grep -m 5 '_gr' <<<"$exports" || true
          missing=0
          while read -r name bytes; do
            [[ -z "$name" || "$name" == \#* ]] && continue
            grep -qE "(^|[[:space:]])_${name}@${bytes}([[:space:]]|\$)" <<<"$exports" || { echo "missing export _${name}@${bytes}"; missing=1; }
          done < <(tr -d '\r' < crates/glide2x/exports.txt)
          exit $missing
