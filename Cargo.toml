[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/michidk/rustyglide"

[workspace.dependencies]
rustyglide-core = { path = "crates/rustyglide-core" }
rustyglide-wgpu = { path = "crates/rustyglide-wgpu" }
rustyglide = { path = "crates/rustyglide" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12", "gles"] }
raw-window-handle = "0.6"
pollster = "0.4"
log = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
