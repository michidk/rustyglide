# cargo-deny: licences and advisories of the dependency tree.
[graph]
all-features = true

[licenses]
# Permissive licences only: the crates must stay usable in MIT-licensed hosts
# such as Maiko. Copyleft code (GPL, LGPL) never enters the production tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
