# cargo-deny: licences and advisories of the dependency tree.
[graph]
all-features = true

[licenses]
# Permissive licences only: the crates must stay usable in MIT-licensed hosts
# such as Maiko. Copyleft code (GPL, LGPL) never enters the production tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# The optional `shaders` feature only: librashader and two of its dependencies
# are MPL-2.0, a per-file copyleft that hosts can link without relicensing.
# Default builds contain none of them.
exceptions = [
    { crate = "librashader", allow = ["MPL-2.0"] },
    { crate = "librashader-cache", allow = ["MPL-2.0"] },
    { crate = "librashader-common", allow = ["MPL-2.0"] },
    { crate = "librashader-pack", allow = ["MPL-2.0"] },
    { crate = "librashader-preprocess", allow = ["MPL-2.0"] },
    { crate = "librashader-presets", allow = ["MPL-2.0"] },
    { crate = "librashader-reflect", allow = ["MPL-2.0"] },
    { crate = "librashader-runtime", allow = ["MPL-2.0"] },
    { crate = "librashader-runtime-wgpu", allow = ["MPL-2.0"] },
    { crate = "persy", allow = ["MPL-2.0"] },
    { crate = "smartstring", allow = ["MPL-2.0"] },
]

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained, not vulnerable; pulled in by librashader (`shaders` feature
    # only) with no maintained replacement yet. Drop when librashader moves on.
    { id = "RUSTSEC-2025-0141", reason = "bincode via librashader-cache" },
    { id = "RUSTSEC-2026-0249", reason = "smartstring via glslang" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
