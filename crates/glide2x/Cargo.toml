[package]
name = "glide2x"
description = "Drop-in glide2x.dll / libglide2x.so built on rustyglide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dev-dependencies]
rustyglide.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glide-abi = { path = "../glide-abi" }

[features]
# RetroArch slang shader presets on the window image (RUSTYGLIDE_SHADER).
shaders = ["glide-abi/shaders"]

[lints]
workspace = true
