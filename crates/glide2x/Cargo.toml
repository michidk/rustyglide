[package]
name = "glide2x"
description = "Drop-in glide2x.dll / libglide2x.so built on rustyglide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustyglide.workspace = true
raw-window-handle.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
